<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кошик</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="../cart.js" defer></script>
</head>
<body>
    <header>
        <nav class="navbar">
            <button class="hamburger" id="hamburger-btn"><i class="fas fa-bars"></i> Меню</button>
            <a href="index.html" class="nav-item"><i class="fas fa-home"></i> Головна</a>
            <a href="cart.html" class="nav-item"><i class="fas fa-shopping-cart"></i> Кошик</a>
            <a href="registration.html" class="nav-item"><i class="fas fa-user"></i> Вхід</a>
            <a href="admin.html" class="nav-item" id="admin-link"><i class="fas fa-cogs"></i> Адмін</a>
            <a id="logout-btn" class="nav-item"><i class="fas fa-sign-out-alt"></i> Вийти</a>

        </nav>
    </header>
    <main>
        <h1>Ваш кошик</h1>
        <div id="cart-container" class="cart-container"></div>

        <aside class="order-form">
            <h2>Оформлення замовлення</h2>
            <p id="total-price" class="total-price">Загальна сума: 0 грн</p>
            <form id="checkout-form">
                <label for="customer-name">Ім'я</label>
                <input type="text" id="customer-name" placeholder="Ваше ім'я" required>
        
                <label for="customer-phone">Телефон</label>
                <input type="tel" id="customer-phone" placeholder="+380123456789" required>
        
                <button type="submit">Оформити замовлення</button>
            </form>
        </aside>
    </main>
    <footer>
        <p>&copy; 2025 Electronics Store. All rights reserved.</p>
    </footer>
    <script>
        const hamburger = document.getElementById('hamburger-btn');
        const navbar = document.querySelector('.navbar');

        hamburger.addEventListener('click', () => {
            navbar.classList.toggle('active');
        });
    </script>
</body>
</html>
