<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="../login.js" defer></script>
</head>
<body>
    <header>
        <nav class="navbar">
            <button class="hamburger" id="hamburger-btn"><i class="fas fa-bars"></i> Меню</button>
            <a href="index.html" class="nav-item"><i class="fas fa-home"></i> Головна</a>
            <a href="cart.html" class="nav-item"><i class="fas fa-shopping-cart"></i> Кошик</a>
            <a href="registration.html" class="nav-item"><i class="fas fa-user"></i> Вхід</a>
            <a href="admin.html" class="nav-item" id="admin-link"><i class="fas fa-cogs"></i> Адмін</a>
            <a id="logout-btn" class="nav-item"><i class="fas fa-sign-out-alt"></i> Вийти</a>
        </nav>
    </header>
    <main>
        <h1>Вхід</h1>
        <form class="login-form">
            <label for="email">Електронна пошта:</label>
            <input type="email" id="email" name="email" required placeholder="Введіть вашу пошту">
            
            <label for="password">Пароль:</label>
            <input type="password" id="password" name="password" required placeholder="Введіть пароль">
            
            <button type="submit">Увійти</button>
            <p>Немає акаунту? <a href="registration.html">Зареєструватися</a></p>
        </form>
    </main>
    <footer>
        <p>&copy; 2025 Electronics Store. All rights reserved.</p>
    </footer>
    <script>
        const hamburger = document.getElementById('hamburger-btn');
        const navbar = document.querySelector('.navbar');

        hamburger.addEventListener('click', () => {
            navbar.classList.toggle('active');
        });
    </script>
</body>
</html>
