<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін-панель</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="../admin_script.js" defer></script>
</head>
<body>
    <header>
        <nav class="navbar">
            <button class="hamburger" id="hamburger-btn"><i class="fas fa-bars"></i> Меню</button>
            <a href="index.html" class="nav-item"><i class="fas fa-home"></i> Головна</a>
            <a href="cart.html" class="nav-item"><i class="fas fa-shopping-cart"></i> Кошик</a>
            <a href="registration.html" class="nav-item"><i class="fas fa-user"></i> Вхід</a>
            <a href="admin.html" class="nav-item"><i class="fas fa-cogs"></i> Адмін</a>
            <a id="logout-btn" class="nav-item"><i class="fas fa-sign-out-alt"></i> Вийти</a>
        </nav>
    </header>

    <main>
        <h1>Панель адміністратора</h1>

        <section id="add-category">
            <h2>Додати категорію</h2>
            <form id="category-form">
                <label for="category-name">Назва категорії:</label>
                <input type="text" id="category-name" required>

                <button type="submit">Додати категорію</button>
            </form>
        </section>

        <section id="delete-category">
            <h2>Видалити категорію</h2>
            <form id="delete-category-form">
                <label for="category-delete-select">Виберіть категорію для видалення:</label>
                <select id="category-delete-select">
                </select>
                <button type="submit">Видалити категорію</button>
            </form>
        </section>

        <section id="add-product">
            <h2>Додати товар</h2>
            <form id="product-form">
                <label for="product-name">Назва товару:</label>
                <input type="text" id="product-name" required>
            
                <label for="category-select">Категорія:</label>
                <select id="category-select">
                </select>
            
                <label for="product-price">Ціна:</label>
                <input type="number" id="product-price" required>
            
                <label for="product-description">Короткий опис товару:</label>
                <textarea id="product-description" required></textarea>
            
                <label for="product-image">Фото товару:</label>
                <input type="file" id="product-image" accept="image/*">
            
                <button type="submit">Додати товар</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Electronics Store. All rights reserved.</p>
    </footer>
    <script>
        const hamburger = document.getElementById('hamburger-btn');
        const navbar = document.querySelector('.navbar');

        hamburger.addEventListener('click', () => {
            navbar.classList.toggle('active');
        });
    </script>
</body>
</html>
