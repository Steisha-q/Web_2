<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація / Вхід</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="../script.js"></script>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h2>Реєстрація</h2>
            <form id="registrationForm">
                <label for="username">Логін:</label>
                <input type="text" id="username" name="username" required>
                
                <label for="email">Електронна пошта:</label>
                <input type="email" id="email" name="email" required>
                
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" required>

                <button type="submit">Зареєструватися</button>
            </form>
            <p>Уже є акаунт? <a href="#" id="switchToLogin">Увійти</a></p>
        </div>
        
        <div class="form-container" id="loginFormContainer" style="display: none;">
            <h2>Вхід</h2>
            <form id="loginForm">
                <label for="loginUsername">Логін:</label>
                <input type="text" id="loginUsername" name="username" required>
                
                <label for="loginPassword">Пароль:</label>
                <input type="password" id="loginPassword" name="password" required>

                <button type="submit">Увійти</button>
            </form>
            <p>Немає акаунта? <a href="#" id="switchToRegister">Зареєструватися</a></p>
        </div>
    </div>

</body>
</html>
