<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин електроніки</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="../admin_script.js" defer></script>   
</head>
<body>
    <header>
        <nav class="navbar">
            <img src="../web_logo.png" alt="Logo" class="logo" style="height: 35px;">
            <button class="hamburger" id="hamburger-btn"><i class="fas fa-bars"></i> Меню</button>
            <a href="index.html" class="nav-item"><i class="fas fa-home"></i> Головна</a>
            <a href="cart.html" class="nav-item"><i class="fas fa-shopping-cart"></i> Кошик</a>
            <a href="registration.html" class="nav-item"><i class="fas fa-user"></i> Вхід</a>
            <a href="admin.html" class="nav-item" id="admin-link"><i class="fas fa-cogs"></i> Адмін</a>
            <a id="logout-btn" class="nav-item"><i class="fas fa-sign-out-alt"></i> Вийти</a>
        </nav>
    </header>
    
    <div class="container">
        <aside class="sidebar">
            <section id="categories-list">
                <h2>Категорії товарів</h2>
                <ul id="category-list">
                </ul>
            </section>
        </aside>

        <main>
            <div id="products-section">
                <h1>Товари</h1>
                <section id="products-container">
                </section>
            </div>
        </main>
    </div>
    

    <footer>
        <p>&copy; 2025 Electronics Store. All rights reserved.</p>
    </footer>

    <script>
        const hamburger = document.getElementById('hamburger-btn');
        const navbar = document.querySelector('.navbar');

        hamburger.addEventListener('click', () => {
            navbar.classList.toggle('active');
        });
    </script>
</body>
</html>
